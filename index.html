<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIKENDALI — Sistem Kendali Kinerja Bidang Umum &amp; Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#16241f;
    --paper:#f4f1ea;
    --panel:#ffffff;
    --line:#d9d3c4;
    --line-soft:#e8e3d6;
    --teal:#0f5c56;
    --teal-deep:#0a3d39;
    --teal-soft:#e2eeec;
    --amber:#b3771c;
    --amber-soft:#f6ead3;
    --red:#a23b32;
    --red-soft:#f4ddd8;
    --green:#3a7145;
    --green-soft:#e2ecdf;
    --muted:#6b6459;
    --shadow: 0 1px 2px rgba(22,36,31,0.06), 0 6px 20px rgba(22,36,31,0.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:'Source Serif 4',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ===== Shell ===== */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:264px;flex-shrink:0;background:var(--teal-deep);color:#eef4f2;
    padding:28px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.14);padding-bottom:18px;}
  .brand .mark{font-family:'Source Serif 4',serif;font-weight:700;font-size:22px;letter-spacing:0.02em;}
  .brand .sub{font-size:11px;color:#a9c4bd;letter-spacing:0.04em;text-transform:uppercase;}
  .org-line{margin-top:16px;font-size:11.5px;line-height:1.6;color:#bcd4cd;}
  .org-line b{color:#fff;font-weight:600;}
  .nav{margin-top:22px;display:flex;flex-direction:column;gap:2px;}
  .nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:#7fa89f;margin:14px 4px 6px;}
  .nav a{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;
    font-size:13.5px;color:#dcebe7;text-decoration:none;transition:background .15s;
  }
  .nav a:hover{background:rgba(255,255,255,0.06);}
  .nav a.active{background:#e2eeec;color:var(--teal-deep);font-weight:600;}
  .nav a .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;}

  .main{flex:1;min-width:0;padding:32px 40px 80px;max-width:1180px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
  .topbar h1{font-size:26px;margin:0 0 4px;font-weight:600;}
  .topbar .desc{color:var(--muted);font-size:13.5px;max-width:560px;}
  .period-picker{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;box-shadow:var(--shadow);}
  .period-picker label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .period-picker select{border:none;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--teal-deep);}

  /* ===== Cards ===== */
  .grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:30px;}
  .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;box-shadow:var(--shadow);padding:18px 18px 16px;}
  .bidang-card{cursor:pointer;transition:transform .15s, box-shadow .15s;position:relative;overflow:hidden;}
  .bidang-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(22,36,31,0.12);}
  .bidang-card .accent{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .bidang-card .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .bidang-card h3{font-size:16px;margin:3px 0 12px;font-weight:600;}
  .score-row{display:flex;align-items:center;gap:14px;}
  .ring{position:relative;width:64px;height:64px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.01em;}
  .badge.green{background:var(--green-soft);color:var(--green);}
  .badge.teal{background:var(--teal-soft);color:var(--teal);}
  .badge.amber{background:var(--amber-soft);color:var(--amber);}
  .badge.red{background:var(--red-soft);color:var(--red);}
  .trend{font-size:11.5px;color:var(--muted);margin-top:8px;}
  .trend .up{color:var(--green);} .trend .down{color:var(--red);}

  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 12px;}
  .section-title h2{font-size:17px;font-weight:600;margin:0;}
  .section-title .hint{font-size:12px;color:var(--muted);}

  /* ===== Table ===== */
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
  thead th{background:var(--teal-soft);color:var(--teal-deep);text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;border-bottom:1px solid var(--line-soft);}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fbfaf6;}
  input.cell-input{width:90px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .kpi-name{font-weight:500;}
  .kpi-meta{font-size:11px;color:var(--muted);margin-top:2px;}

  .breadcrumb{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .breadcrumb b{color:var(--ink);}

  .btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink);}
  .btn:hover{border-color:var(--teal);color:var(--teal-deep);}
  .btn.primary{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep);}
  .btn.primary:hover{background:var(--teal);}
  .btn.danger{color:var(--red);}
  .btn.small{padding:4px 9px;font-size:11.5px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  .supv-block{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;margin-top:14px;box-shadow:var(--shadow);}
  .supv-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;}
  .supv-head h4{margin:0;font-size:14px;font-weight:600;}
  .supv-head .score{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;}
  .supv-body{padding:0 16px 16px;display:none;}
  .supv-body.open{display:block;}

  .chart-wrap{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:18px;box-shadow:var(--shadow);}

  .panel-note{font-size:12px;color:var(--muted);background:var(--teal-soft);border-radius:8px;padding:10px 13px;margin-bottom:16px;line-height:1.5;}
  .panel-note.err{background:var(--red-soft);color:var(--red);}

  .settings-grid{display:grid;grid-template-columns:1fr;gap:20px;}
  .field-row{display:grid;grid-template-columns:2fr 1fr .8fr .8fr .9fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line-soft);font-size:12.5px;}
  .field-row input, .field-row select{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:5px;font-size:12px;font-family:inherit;}
  .field-row.head{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);}

  footer.app{margin-top:50px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

  .modal-bg{position:fixed;inset:0;background:rgba(22,36,31,.45);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel);border-radius:12px;padding:22px 24px;width:420px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal h3{margin-top:0;}
  .modal label{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 4px;}
  .modal input, .modal select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;}

  @media(max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;}
    .main{padding:22px 18px 60px;}
    .field-row{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">SIKENDALI</div>
      <div class="sub">Kendali Kinerja &middot; Bidang Umum &amp; Keuangan</div>
    </div>
    <div class="org-line" id="orgLine">
      <b>Wakil Direktur</b> Umum &amp; Keuangan<br>
      mengawasi 5 manajer &middot; setiap manajer membawahi supervisor
    </div>
    <div id="roleBox" style="margin-top:12px;padding:9px 11px;background:rgba(255,255,255,0.07);border-radius:7px;font-size:11.5px;"></div>
    <div class="nav" id="navBidang"></div>
    <div class="nav-label">Analisis</div>
    <div class="nav" id="navAnalisis">
      <a href="#" data-page="dashboard"><span class="dot"></span> Dashboard Utama</a>
      <a href="#" data-page="evaluasi"><span class="dot"></span> Evaluasi Periodik</a>
      <a href="#" data-page="tren"><span class="dot"></span> Tren &amp; Analisis</a>
      <a href="#" data-page="pengaturan" id="navPengaturan"><span class="dot"></span> Pengaturan KPI</a>
    </div>
  </aside>

  <main class="main" id="mainArea"></main>
</div>

<div class="modal-bg open" id="modalBg">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* ================= KONFIGURASI SUPABASE =================
   Isi dua nilai ini sesuai proyek Supabase Anda (Project Settings > API).
   ANON KEY aman ditaruh di frontend — tabel-tabel di database tetap
   terkunci oleh RLS, ANON KEY hanya dipakai untuk memanggil Edge
   Function, bukan untuk mengakses tabel langsung. */
const SUPABASE_URL = "https://boypquynhddizdiyepuq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_k-1r9U_iFo5TWgSfFbF_hQ_Lt0BF_SG";
const FN = (name) => `${SUPABASE_URL}/functions/v1/${name}`;

async function callFn(name, payload) {
  const res = await fetch(FN(name), {
    method: payload === undefined ? "GET" : "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    },
    body: payload === undefined ? undefined : JSON.stringify(payload),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ("Gagal memanggil " + name));
  return body;
}

/* ================= DATA MODEL ================= */
const CATS = [
  {min:90, label:"Sangat Baik", cls:"green"},
  {min:80, label:"Baik", cls:"teal"},
  {min:70, label:"Cukup", cls:"amber"},
  {min:0,  label:"Kurang", cls:"red"}
];
function kategori(skor){ return CATS.find(c=>skor>=c.min); }

let appData = null;
let currentPage = "dashboard";
let currentBidangId = null;
let currentRole = null;      // "wadir" atau id bidang atau "supv:kode" — dari server, bukan pilihan bebas
let currentRoleName = "";
let currentPin = null;       // disimpan di memori tab ini saja, dikirim ulang tiap aksi simpan

function roleCanEdit(bidangId){
  return currentRole==="wadir" || currentRole===bidangId;
}
function roleIsWadir(){ return currentRole==="wadir"; }

/* ================= LOGIN PIN (menggantikan showRoleGate lama) ================= */
function showLoginPin(errMsg){
  const modal = document.getElementById("modalBox");
  const bg = document.getElementById("modalBg");
  modal.innerHTML = `
    <h3>Masuk ke SIKENDALI</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-6px;">Masukkan PIN Anda. PIN dicocokkan ke server setiap kali Anda menyimpan data, jadi jaga kerahasiaannya.</p>
    ${errMsg ? `<div class="panel-note err">${errMsg}</div>` : ""}
    <label>PIN</label>
    <input type="password" inputmode="numeric" id="pinInput" placeholder="Contoh: 190001" autofocus>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn primary" id="pinSubmit">Masuk</button>
    </div>
  `;
  bg.classList.add("open");
  const submit = async ()=>{
    const pin = document.getElementById("pinInput").value.trim();
    if(!pin) return;
    const btn = document.getElementById("pinSubmit");
    btn.textContent = "Memeriksa..."; btn.disabled = true;
    try{
      const r = await callFn("login", {pin});
      currentPin = pin;
      currentRole = r.user.peran;
      currentRoleName = r.user.nama;
      bg.classList.remove("open");
      await fetchAppData();
      render();
    }catch(e){
      showLoginPin(e.message || "PIN salah.");
    }
  };
  document.getElementById("pinSubmit").onclick = submit;
  document.getElementById("pinInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); });
}

function logout(){
  currentPin = null; currentRole = null; currentRoleName = "";
  showLoginPin();
}

/* ================= AMBIL DATA DARI SERVER ================= */
async function fetchAppData(){
  appData = await callFn("get-data");
}

/* ================= SCORING (tidak berubah dari versi sebelumnya) ================= */
function capaianPct(kpi, period){
  const val = kpi.capaian[period];
  if(val===undefined || val===null || val==="") return null;
  const v = parseFloat(val);
  if(isNaN(v)) return null;
  let pct;
  if(kpi.arah==="naik"){ pct = kpi.target>0 ? (v/kpi.target*100) : (v>=kpi.target?100:0); }
  else { pct = v>0 ? (kpi.target/v*100) : 100; }
  return Math.max(0, Math.min(120, pct));
}
function skorManajerLangsung(bidangObj, period){
  let skor=0;
  bidangObj.kpi.forEach(k=>{
    const pct = capaianPct(k, period);
    if(pct!==null) skor += pct*(k.bobot/100);
  });
  return skor;
}
function skorSupervisor(supv, period){
  let skor=0;
  supv.kpi.forEach(k=>{
    const pct = capaianPct(k, period);
    if(pct!==null) skor += pct*(k.bobot/100);
  });
  return skor;
}
function skorBidangAkhir(bidangObj, period){
  const langsung = skorManajerLangsung(bidangObj, period);
  const supvScores = bidangObj.supervisors.map(s=>skorSupervisor(s, period));
  const avgSupv = supvScores.length ? supvScores.reduce((a,b)=>a+b,0)/supvScores.length : 0;
  return { akhir: langsung*0.7 + avgSupv*0.3, langsung, avgSupv, supvScores };
}

function ringSVG(skor, size=64, color){
  const r = (size/2)-6, c = 2*Math.PI*r;
  const pct = Math.max(0,Math.min(100,skor));
  const offset = c - (pct/100)*c;
  return `<svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#e8e3d6" stroke-width="6" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="6" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

/* ================= RENDER: SHELL ================= */
function renderNav(){
  const nav = document.getElementById("navBidang");
  nav.innerHTML = `<div class="nav-label">${appData.bidang.length} Bidang</div>` + appData.bidang.map(b=>
    `<a href="#" data-page="bidang" data-id="${b.id}" class="${currentPage==='bidang'&&currentBidangId===b.id?'active':''}">
      <span class="dot" style="color:${b.warna}"></span> ${b.manajer}${roleCanEdit(b.id)&&currentRole!=="wadir"?' ✎':''}
    </a>`).join("");

  const roleBox = document.getElementById("roleBox");
  if(roleBox){
    roleBox.innerHTML = `Masuk sebagai<br><b style="color:#fff;">${currentRoleName}</b><br><a href="#" id="switchRole" style="color:#a9c4bd;font-size:11px;">Keluar / Ganti PIN</a>`;
    const sw = document.getElementById("switchRole");
    if(sw) sw.onclick = (e)=>{ e.preventDefault(); logout(); };
  }

  const navPengaturan = document.getElementById("navPengaturan");
  if(navPengaturan) navPengaturan.style.display = roleIsWadir() ? "" : "none";

  document.querySelectorAll('.nav a').forEach(a=>{
    a.onclick = (e)=>{ e.preventDefault(); if(a.style.display==="none")return; currentPage=a.dataset.page; currentBidangId=a.dataset.id||null; render(); };
  });
}

function render(){
  if(!appData) return;
  if(currentPage==="pengaturan" && !roleIsWadir()){ currentPage="dashboard"; }
  renderNav();
  document.querySelectorAll('.nav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.page===currentPage && (a.dataset.page!=='bidang' || a.dataset.id===currentBidangId));
  });
  const main = document.getElementById("mainArea");
  if(currentPage==="dashboard") main.innerHTML = pageDashboard();
  else if(currentPage==="bidang") main.innerHTML = pageBidang(currentBidangId);
  else if(currentPage==="evaluasi") main.innerHTML = pageEvaluasi();
  else if(currentPage==="tren") main.innerHTML = pageTren();
  else if(currentPage==="pengaturan") main.innerHTML = pagePengaturan();
  attachHandlers();
}

/* ================= PAGE: DASHBOARD ================= */
function pageDashboard(){
  const p = appData.currentPeriod;
  const cards = appData.bidang.map(b=>{
    const {akhir} = skorBidangAkhir(b, p);
    const cat = kategori(akhir);
    const idx = appData.periods.indexOf(p);
    let trendHtml = "";
    if(idx>0){
      const prevP = appData.periods[idx-1];
      const prevSkor = skorBidangAkhir(b, prevP).akhir;
      if(prevSkor>0){
        const diff = akhir-prevSkor;
        trendHtml = `<span class="${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${Math.abs(diff).toFixed(1)} pts</span> vs ${prevP}`;
      }
    }
    return `<div class="card bidang-card" data-goto="${b.id}">
      <div class="accent" style="background:${b.warna}"></div>
      <div class="eyebrow">${b.nama}</div>
      <h3>${b.manajer}</h3>
      <div class="score-row">
        <div class="ring">${ringSVG(akhir,64,b.warna)}<div class="num">${akhir.toFixed(0)}</div></div>
        <div>
          <span class="badge ${cat.cls}">${cat.label}</span>
          <div class="trend">${trendHtml||"Belum ada data periode sebelumnya"}</div>
        </div>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="topbar">
      <div><h1>Dashboard Kendali Kinerja</h1><div class="desc">Ringkasan capaian lima bidang di bawah Wakil Direktur Umum &amp; Keuangan, dengan skor tercascade dari manajer dan seluruh supervisor.</div></div>
      ${periodPicker()}
    </div>
    <div class="grid-4">${cards}</div>
    <div class="section-title"><h2>Perbandingan Skor Antar Bidang — ${p}</h2></div>
    <div class="chart-wrap"><canvas id="chartCompare" height="90"></canvas></div>
    <footer class="app">
      <span>SIKENDALI &middot; RSU Allam Medica &middot; skor = 70% capaian manajer langsung + 30% rata-rata capaian supervisor</span>
      <span>${appData.bidang.length} bidang &middot; ${appData.bidang.reduce((a,b)=>a+b.supervisors.length,0)} supervisor &middot; data langsung dari Supabase</span>
    </footer>
  `;
}

/* ================= PAGE: DETAIL BIDANG ================= */
function pageBidang(id){
  const b = appData.bidang.find(x=>x.id===id);
  if(!b) return `<p>Bidang tidak ditemukan.</p>`;
  const p = appData.currentPeriod;
  const {akhir, langsung, avgSupv} = skorBidangAkhir(b, p);
  const cat = kategori(akhir);

  const canEdit = roleCanEdit(b.id);
  const kpiRows = b.kpi.map(k=>{
    const pct = capaianPct(k, p);
    const val = k.capaian[p] ?? "";
    return `<tr>
      <td><div class="kpi-name">${k.nama}</div><div class="kpi-meta">Target ${k.target} ${k.satuan} &middot; bobot ${k.bobot}% &middot; arah ${k.arah==='naik'?'semakin tinggi semakin baik':'semakin rendah semakin baik'}</div></td>
      <td><input type="number" class="cell-input" data-kpi="${k.id}" data-scope="manajer" value="${val}" placeholder="—" ${canEdit?'':'disabled'}></td>
      <td class="mono">${pct===null?'—':pct.toFixed(0)+'%'}</td>
    </tr>`;
  }).join("");

  const supvBlocks = b.supervisors.map(s=>{
    const skor = skorSupervisor(s, p);
    const c = kategori(skor);
    const canEditSupv = canEdit || currentRole===('supv:'+s.id);
    const rows = s.kpi.map(k=>{
      const pct = capaianPct(k, p);
      const val = k.capaian[p] ?? "";
      return `<tr>
        <td><div class="kpi-name">${k.nama}</div><div class="kpi-meta">Target ${k.target} ${k.satuan} &middot; bobot ${k.bobot}%</div></td>
        <td><input type="number" class="cell-input" data-kpi="${k.id}" data-scope="supv" data-owner="${s.id}" value="${val}" placeholder="—" ${canEditSupv?'':'disabled'}></td>
        <td class="mono">${pct===null?'—':pct.toFixed(0)+'%'}</td>
      </tr>`;
    }).join("");
    return `<div class="supv-block">
      <div class="supv-head" data-toggle="${s.id}">
        <h4>${s.nama}</h4>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="badge ${c.cls}">${c.label}</span>
          <span class="score mono">${skor.toFixed(0)}</span>
        </div>
      </div>
      <div class="supv-body" id="body-${s.id}">
        <table><thead><tr><th>Indikator</th><th>Realisasi (${p})</th><th>Capaian</th></tr></thead>
        <tbody>${rows}</tbody></table>
        ${canEditSupv?`<div class="btn-row"><button class="btn small primary" data-save-supv="${s.id}">Simpan Realisasi ${s.nama}</button></div>`:''}
      </div>
    </div>`;
  }).join("");

  return `
    <div class="topbar">
      <div>
        <div class="breadcrumb">Wadir Umum &amp; Keuangan &rsaquo; <b>${b.manajer}</b></div>
        <h1>${b.nama}</h1>
        <div class="desc">Skor akhir tercascade dari indikator manajer langsung (70%) dan rata-rata skor ${b.supervisors.length} supervisor (30%).</div>
      </div>
      ${periodPicker()}
    </div>

    <div class="grid-4" style="grid-template-columns:repeat(3,minmax(160px,1fr));margin-bottom:22px;">
      <div class="card"><div class="eyebrow">Skor Akhir Bidang</div>
        <div class="score-row" style="margin-top:8px;"><div class="ring">${ringSVG(akhir,56,b.warna)}<div class="num" style="font-size:13px;">${akhir.toFixed(0)}</div></div>
        <span class="badge ${cat.cls}">${cat.label}</span></div>
      </div>
      <div class="card"><div class="eyebrow">Capaian Manajer Langsung</div><div class="serif" style="font-size:26px;margin-top:6px;">${langsung.toFixed(0)}</div></div>
      <div class="card"><div class="eyebrow">Rata-rata Capaian Supervisor</div><div class="serif" style="font-size:26px;margin-top:6px;">${avgSupv.toFixed(0)}</div></div>
    </div>

    <div class="section-title"><h2>Indikator Kinerja ${b.manajer}</h2><span class="hint">Input realisasi periode ${p}</span></div>
    <table><thead><tr><th style="width:55%">Indikator</th><th>Realisasi</th><th>Capaian</th></tr></thead><tbody>${kpiRows}</tbody></table>
    <div class="btn-row">${canEdit?'<button class="btn primary" id="saveKpiManajer">Simpan Realisasi Manajer</button>':'<span class="hint">Hanya '+b.manajer+' atau Wadir yang dapat mengisi realisasi ini.</span>'}</div>

    <div class="section-title"><h2>Supervisor di Bawah ${b.manajer}</h2><span class="hint">Klik untuk buka/tutup detail</span></div>
    ${supvBlocks}

    <div class="section-title"><h2>Tren Skor ${b.nama}</h2></div>
    <div class="chart-wrap"><canvas id="chartBidangTren" height="80"></canvas></div>
  `;
}

/* ================= PAGE: EVALUASI PERIODIK ================= */
function pageEvaluasi(){
  const p = appData.currentPeriod;
  const rows = appData.bidang.map(b=>{
    const {akhir, langsung, avgSupv} = skorBidangAkhir(b, p);
    const cat = kategori(akhir);
    return `<tr>
      <td><b>${b.manajer}</b><div class="kpi-meta">${b.nama}</div></td>
      <td class="mono">${langsung.toFixed(1)}</td>
      <td class="mono">${avgSupv.toFixed(1)}</td>
      <td class="mono"><b>${akhir.toFixed(1)}</b></td>
      <td><span class="badge ${cat.cls}">${cat.label}</span></td>
    </tr>`;
  }).join("");

  return `
    <div class="topbar">
      <div><h1>Evaluasi Periodik</h1><div class="desc">Rekap skor evaluasi seluruh manajer untuk satu periode penilaian — siap digunakan sebagai bahan rapat kinerja bulanan.</div></div>
      ${periodPicker()}
    </div>
    <div class="panel-note">Kategori penilaian: <b>Sangat Baik</b> ≥90 &middot; <b>Baik</b> 80–89 &middot; <b>Cukup</b> 70–79 &middot; <b>Kurang</b> &lt;70.</div>
    <table>
      <thead><tr><th>Manajer</th><th>Skor Langsung (70%)</th><th>Skor Supervisor (30%)</th><th>Skor Akhir</th><th>Kategori</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="btn-row"><button class="btn" id="printEval">Cetak / Simpan sebagai PDF</button><button class="btn" id="exportJson">Ekspor Cadangan (JSON)</button></div>

    <div class="section-title"><h2>Detail Supervisor per Bidang — ${p}</h2></div>
    ${appData.bidang.map(b=>{
      const rows2 = b.supervisors.map(s=>{
        const skor = skorSupervisor(s,p); const c=kategori(skor);
        return `<tr><td>${s.nama}</td><td class="mono">${skor.toFixed(1)}</td><td><span class="badge ${c.cls}">${c.label}</span></td></tr>`;
      }).join("");
      return `<h4 style="margin:18px 0 8px;">${b.manajer}</h4><table><thead><tr><th>Supervisor</th><th>Skor</th><th>Kategori</th></tr></thead><tbody>${rows2}</tbody></table>`;
    }).join("")}
  `;
}

/* ================= PAGE: TREN ================= */
function pageTren(){
  return `
    <div class="topbar">
      <div><h1>Tren &amp; Analisis</h1><div class="desc">Perkembangan skor tiap bidang dari periode ke periode untuk membaca pola dan mendeteksi penurunan kinerja sejak dini.</div></div>
    </div>
    <div class="chart-wrap"><canvas id="chartTrenAll" height="90"></canvas></div>
    <div class="section-title"><h2>Tabel Skor per Periode</h2></div>
    <table>
      <thead><tr><th>Periode</th>${appData.bidang.map(b=>`<th>${b.nama}</th>`).join("")}</tr></thead>
      <tbody>
        ${appData.periods.map(p=>`<tr><td class="mono">${p}</td>${appData.bidang.map(b=>{
          const s = skorBidangAkhir(b,p).akhir;
          return `<td class="mono">${s>0?s.toFixed(1):'—'}</td>`;
        }).join("")}</tr>`).join("")}
      </tbody>
    </table>
  `;
}

/* ================= PAGE: PENGATURAN ================= */
function pagePengaturan(){
  const bidangOptions = appData.bidang.map(b=>`<option value="${b.id}">${b.manajer}</option>`).join("");
  return `
    <div class="topbar">
      <div><h1>Pengaturan Indikator (KPI)</h1><div class="desc">Rancang, ubah bobot, target dan arah penilaian untuk indikator manajer maupun supervisor. Total bobot tiap kelompok sebaiknya berjumlah 100%.</div></div>
    </div>
    <div class="panel-note">Pilih bidang untuk mengelola indikator manajer dan tiap supervisornya. Klik "Simpan Semua Perubahan" untuk menulis ke database.</div>
    <div class="period-picker" style="margin-bottom:18px;display:inline-flex;">
      <label>Bidang</label>
      <select id="settingsBidangSel">${bidangOptions}</select>
    </div>
    <div id="settingsBody"></div>
  `;
}

// Menyimpan id yang dihapus per grup supaya ikut dikirim ke server saat "Simpan".
let settingsDeleted = { manajer: [], supv: {} };

function renderSettingsBody(){
  const sel = document.getElementById("settingsBidangSel");
  if(!sel) return;
  const b = appData.bidang.find(x=>x.id===sel.value) || appData.bidang[0];
  settingsDeleted = { manajer: [], supv: {} };
  b.supervisors.forEach(s=>{ settingsDeleted.supv[s.id] = []; });
  const body = document.getElementById("settingsBody");

  function kpiRowsEditable(kpiList, scope, ownerId){
    const totalBobot = kpiList.reduce((a,k)=>a+Number(k.bobot),0);
    const head = `<div class="field-row head"><div>Indikator</div><div>Satuan</div><div>Target</div><div>Bobot %</div><div>Arah</div><div></div></div>`;
    const rows = kpiList.map(k=>`
      <div class="field-row" data-row-scope="${scope}" data-row-owner="${ownerId}" data-row-kpi="${k.id}">
        <input type="text" class="f-nama" value="${k.nama}">
        <input type="text" class="f-satuan" value="${k.satuan}">
        <input type="number" class="f-target" value="${k.target}">
        <input type="number" class="f-bobot" value="${k.bobot}">
        <select class="f-arah"><option value="naik" ${k.arah==='naik'?'selected':''}>naik baik</option><option value="turun" ${k.arah==='turun'?'selected':''}>turun baik</option></select>
        <button class="btn small danger" data-del-kpi="${k.id}" data-del-scope="${scope}" data-del-owner="${ownerId}">Hapus</button>
      </div>`).join("");
    const warn = totalBobot!==100 ? `<div class="kpi-meta" style="color:${totalBobot>100?'var(--red)':'var(--amber)'};margin-top:4px;">Total bobot saat ini ${totalBobot}% (idealnya 100%)</div>` : `<div class="kpi-meta" style="margin-top:4px;">Total bobot 100% ✓</div>`;
    return head+rows+warn;
  }

  const supvSections = b.supervisors.map(s=>`
    <div class="card" style="margin-top:14px;">
      <h3 style="margin-top:0;">${s.nama}</h3>
      ${kpiRowsEditable(s.kpi,"supv",s.id)}
      <div class="btn-row"><button class="btn small" data-add-kpi="supv" data-owner="${s.id}">+ Tambah Indikator</button></div>
    </div>`).join("");

  body.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">Indikator Manajer — ${b.manajer}</h3>
      ${kpiRowsEditable(b.kpi,"manajer",b.id)}
      <div class="btn-row"><button class="btn small" data-add-kpi="manajer" data-owner="${b.id}">+ Tambah Indikator</button></div>
    </div>
    <div class="section-title"><h2>Indikator per Supervisor</h2></div>
    ${supvSections}
    <div class="btn-row" style="margin-top:18px;"><button class="btn primary" id="saveSettings">Simpan Semua Perubahan</button></div>
  `;

  body.querySelectorAll('[data-add-kpi]').forEach(btn=>{
    btn.onclick=()=>{
      const scope = btn.dataset.addKpi, owner = btn.dataset.owner;
      const list = scope==='manajer' ? b.kpi : b.supervisors.find(s=>s.id===owner).kpi;
      list.push({id:"k"+Math.random().toString(36).slice(2,8), nama:"Indikator baru", satuan:"%", target:100, bobot:0, arah:"naik", capaian:{}});
      renderSettingsBody();
    };
  });
  body.querySelectorAll('[data-del-kpi]').forEach(btn=>{
    btn.onclick=()=>{
      const scope=btn.dataset.delScope, owner=btn.dataset.delOwner, kid=btn.dataset.delKpi;
      const list = scope==='manajer' ? b.kpi : b.supervisors.find(s=>s.id===owner).kpi;
      const idx = list.findIndex(k=>k.id===kid);
      if(idx>-1) list.splice(idx,1);
      if(scope==='manajer') settingsDeleted.manajer.push(kid);
      else (settingsDeleted.supv[owner] ??= []).push(kid);
      renderSettingsBody();
    };
  });
  const saveBtn = document.getElementById("saveSettings");
  if(saveBtn) saveBtn.onclick = async ()=>{
    body.querySelectorAll('.field-row[data-row-kpi]').forEach(row=>{
      const scope=row.dataset.rowScope, owner=row.dataset.rowOwner, kid=row.dataset.rowKpi;
      const list = scope==='manajer' ? b.kpi : b.supervisors.find(s=>s.id===owner).kpi;
      const k = list.find(x=>x.id===kid);
      if(!k) return;
      k.nama = row.querySelector('.f-nama').value;
      k.satuan = row.querySelector('.f-satuan').value;
      k.target = parseFloat(row.querySelector('.f-target').value)||0;
      k.bobot = parseFloat(row.querySelector('.f-bobot').value)||0;
      k.arah = row.querySelector('.f-arah').value;
    });
    saveBtn.textContent = "Menyimpan..."; saveBtn.disabled = true;
    try{
      await callFn("submit-settings", {
        pin: currentPin,
        bidangId: b.id,
        kpiManajer: { items: b.kpi, deletedIds: settingsDeleted.manajer },
        supervisors: b.supervisors.map(s=>({ id: s.id, items: s.kpi, deletedIds: settingsDeleted.supv[s.id]||[] })),
      });
      await fetchAppData();
      render();
      toast("Perubahan indikator tersimpan ke database.");
    }catch(e){
      toast("Gagal menyimpan: " + e.message);
      saveBtn.textContent = "Simpan Semua Perubahan"; saveBtn.disabled = false;
    }
  };
}

/* ================= SHARED WIDGETS ================= */
function periodPicker(){
  return `<div class="period-picker">
    <label>Periode</label>
    <select id="periodSel">
      ${appData.periods.map(p=>`<option value="${p}" ${p===appData.currentPeriod?'selected':''}>${p}</option>`).join("")}
    </select>
  </div>`;
}

function toast(msg){
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = "position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16241f;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center;";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

/* ================= HANDLERS ================= */
function attachHandlers(){
  const periodSel = document.getElementById("periodSel");
  if(periodSel) periodSel.onchange = ()=>{ appData.currentPeriod = periodSel.value; render(); };

  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.onclick = ()=>{ currentPage="bidang"; currentBidangId=el.dataset.goto; render(); };
  });

  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.toggle;
      document.getElementById("body-"+id).classList.toggle("open");
    };
  });

  const saveManajer = document.getElementById("saveKpiManajer");
  if(saveManajer) saveManajer.onclick = async ()=>{
    const b = appData.bidang.find(x=>x.id===currentBidangId);
    const updates = [];
    document.querySelectorAll('input[data-scope="manajer"]').forEach(inp=>{
      if(inp.value!=="") updates.push({kpiId: inp.dataset.kpi, nilai: inp.value});
    });
    saveManajer.textContent = "Menyimpan..."; saveManajer.disabled = true;
    try{
      await callFn("submit-realisasi", {
        pin: currentPin, bidangId: b.id, scope: "manajer",
        periode: appData.currentPeriod, updates,
      });
      await fetchAppData();
      toast("Realisasi manajer tersimpan.");
      render();
    }catch(e){
      toast("Gagal menyimpan: " + e.message);
      saveManajer.textContent = "Simpan Realisasi Manajer"; saveManajer.disabled = false;
    }
  };

  document.querySelectorAll('[data-save-supv]').forEach(btn=>{
    btn.onclick = async ()=>{
      const supervisorId = btn.dataset.saveSupv;
      const b = appData.bidang.find(x=>x.id===currentBidangId);
      const updates = [];
      document.querySelectorAll(`input[data-scope="supv"][data-owner="${supervisorId}"]`).forEach(inp=>{
        if(inp.value!=="") updates.push({kpiId: inp.dataset.kpi, nilai: inp.value});
      });
      btn.textContent = "Menyimpan..."; btn.disabled = true;
      try{
        await callFn("submit-realisasi", {
          pin: currentPin, bidangId: b.id, scope: "supv", supervisorId,
          periode: appData.currentPeriod, updates,
        });
        await fetchAppData();
        toast("Realisasi supervisor tersimpan.");
        render();
      }catch(e){
        toast("Gagal menyimpan: " + e.message);
        btn.disabled = false;
      }
    };
  });

  const settingsSel = document.getElementById("settingsBidangSel");
  if(settingsSel){ settingsSel.onchange = renderSettingsBody; renderSettingsBody(); }

  const printBtn = document.getElementById("printEval");
  if(printBtn) printBtn.onclick = ()=>window.print();

  const exportBtn = document.getElementById("exportJson");
  if(exportBtn) exportBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(appData,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sikendali-cadangan-"+appData.currentPeriod+".json";
    a.click();
  };

  drawCharts();
}

/* ================= CHARTS ================= */
let chartRefs = {};
function destroyChart(id){ if(chartRefs[id]){ chartRefs[id].destroy(); delete chartRefs[id]; } }

function drawCharts(){
  if(document.getElementById("chartCompare")){
    destroyChart("chartCompare");
    const ctx = document.getElementById("chartCompare").getContext("2d");
    const p = appData.currentPeriod;
    chartRefs["chartCompare"] = new Chart(ctx,{
      type:"bar",
      data:{ labels: appData.bidang.map(b=>b.manajer),
        datasets:[{ label:"Skor Akhir", data: appData.bidang.map(b=>skorBidangAkhir(b,p).akhir.toFixed(1)),
          backgroundColor: appData.bidang.map(b=>b.warna), borderRadius:6 }]},
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ min:0, max:120, ticks:{stepSize:20} } } }
    });
  }
  if(document.getElementById("chartBidangTren")){
    destroyChart("chartBidangTren");
    const b = appData.bidang.find(x=>x.id===currentBidangId);
    const ctx = document.getElementById("chartBidangTren").getContext("2d");
    chartRefs["chartBidangTren"] = new Chart(ctx,{
      type:"line",
      data:{ labels: appData.periods,
        datasets:[
          {label:"Skor Akhir", data: appData.periods.map(p=>skorBidangAkhir(b,p).akhir), borderColor:b.warna, backgroundColor:b.warna, tension:.3},
          {label:"Manajer Langsung", data: appData.periods.map(p=>skorManajerLangsung(b,p)), borderColor:"#999", borderDash:[4,3], tension:.3},
        ]},
      options:{ scales:{ y:{ min:0, max:120 } } }
    });
  }
  if(document.getElementById("chartTrenAll")){
    destroyChart("chartTrenAll");
    const ctx = document.getElementById("chartTrenAll").getContext("2d");
    chartRefs["chartTrenAll"] = new Chart(ctx,{
      type:"line",
      data:{ labels: appData.periods,
        datasets: appData.bidang.map(b=>({
          label:b.manajer, data: appData.periods.map(p=>skorBidangAkhir(b,p).akhir),
          borderColor:b.warna, backgroundColor:b.warna, tension:.3
        }))},
      options:{ scales:{ y:{ min:0, max:120 } } }
    });
  }
}

showLoginPin();
